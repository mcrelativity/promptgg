<svg width="192" height="192" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo con gradiente -->
  <rect width="512" height="512" rx="128" fill="url(#gradient)"/>
  
  <!-- Gradiente -->
  <defs>
    <linearGradient id="gradient" x1="0" y1="0" x2="512" y2="512">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>
  
  <!-- Texto PG -->
  <text x="256" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="240" font-weight="bold" fill="white" text-anchor="middle">PG</text>
</svg>
